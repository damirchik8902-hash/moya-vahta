
name: Build My Vakhta APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'vakhta_android_project_source.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Unzip project
        run: |
          unzip -o vakhta_android_project_source.zip -d project
          find project -maxdepth 3 -type f | head -100

      - name: Build APK
        run: |
          cd project
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: moya-vahta-apk
          path: project/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
