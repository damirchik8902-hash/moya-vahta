name: Build My Vakhta APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'vakhta_android_project_source*.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest project ZIP
        id: project
        shell: bash
        run: |
          FILE=$(find . -maxdepth 1 -type f \
            -name 'vakhta_android_project_source*.zip' \
            | sort -V | tail -n 1)

          if [ -z "$FILE" ]; then
            echo "Project ZIP not found!"
            exit 1
          fi

          echo "Selected project: $FILE"
          echo "zip=$FILE" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unzip project
        run: unzip -o "${{ steps.project.outputs.zip }}" -d project

      - name: Build APK
        run: |
          cd project/vakhta_android_project
          gradle assembleDebug

      - name: Decode persistent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 secret is missing!"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/myvakhta-release.p12"

      - name: Align APK
        run: |
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          "$ZIPALIGN" -f -p 4 \
            project/vakhta_android_project/app/build/outputs/apk/debug/app-debug.apk \
            "$RUNNER_TEMP/app-aligned.apk"

      - name: Sign APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/myvakhta-release.p12" \
            --ks-type PKCS12 \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$RUNNER_TEMP/app-release.apk" \
            "$RUNNER_TEMP/app-aligned.apk"

          "$APKSIGNER" verify "$RUNNER_TEMP/app-release.apk"

      - name: Diagnose APK
        if: always()
        shell: bash
        run: |
          APK="$RUNNER_TEMP/app-release.apk"
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK file was not created."
            exit 1
          fi

          echo "===== APK FILE ====="
          ls -lh "$APK"
          sha256sum "$APK"

          echo "===== ZIP INTEGRITY ====="
          unzip -t "$APK"

          echo "===== ANDROID PACKAGE INFO ====="
          "$TOOLS/aapt" dump badging "$APK" || true

          echo "===== APK SIGNATURE ====="
          "$TOOLS/apksigner" verify \
            --verbose --print-certs "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: moya-vahta-apk
          path: ${{ runner.temp }}/app-release.apk
          if-no-files-found: error
